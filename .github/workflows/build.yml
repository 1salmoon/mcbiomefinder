name: Build MotionLevi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          echo "Zip: $ZIP"
          mkdir -p src_extracted
          unzip -q "$ZIP" -d src_extracted
          XMAKE=$(find src_extracted -name xmake.lua -not -path "*/third_party/*" | head -n 1)
          test -n "$XMAKE"
          echo "PROJECT_DIR=$(dirname "$XMAKE")" >> "$GITHUB_ENV"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: MotionLevi-levipack
          path: ${{ env.PROJECT_DIR }}/build/android/arm64-v8a/release/MotionLevi.levipack
          if-no-files-found: error
